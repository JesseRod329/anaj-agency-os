<svg width="500" height="500" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="chromeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="20%" style="stop-color:#a8a8a8;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#efefef;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#707070;stop-opacity:1" />
      <stop offset="80%" style="stop-color:#d1d1d1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4a4a4a;stop-opacity:1" />
    </linearGradient>

    <filter id="bevel" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset in="blur" dx="2" dy="2" result="offsetBlur"/>
      <feSpecularLighting in="blur" surfaceScale="5" specularConstant="1" specularExponent="20" lighting-color="#ffffff" result="specOut">
        <fePointLight x="-5000" y="-10000" z="20000"/>
      </feSpecularLighting>
      <feComposite in="specOut" in2="SourceAlpha" operator="in" result="specOut"/>
      <feComposite in="SourceGraphic" in2="specOut" operator="arithmetic" k1="0" k2="1" k3="1" k4="0" result="litPaint"/>
    </filter>
  </defs>

  <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" style="stop-color:#999;stop-opacity:1" />
    <stop offset="100%" style="stop-color:#444;stop-opacity:1" />
  </radialGradient>
  <rect width="500" height="500" fill="url(#bgGlow)" />

  <g filter="url(#bevel)">
    <path d="M250,135 L170,350 L210,350 L230,290 L275,290 L260,325 C260,325 310,380 370,350 L370,140 C370,140 375,100 350,140 L340,290 C340,290 310,360 270,310 L295,245 L250,245 L250,135 Z" 
          fill="url(#chromeGradient)" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
    
    <path d="M120,350 C120,350 180,240 315,240 L310,270 C310,270 180,270 150,340 Z" 
          fill="url(#chromeGradient)" stroke="#333" stroke-width="1.5" />
  </g>
</svg>